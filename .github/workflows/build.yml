STREAMING_CHUNK:Configuring workflow name and triggers...name: Compilar APK Android
on:push:branches: [ "main", "master" ]workflow_dispatch:jobs:build:runs-on: ubuntu-lateststeps:
# STREAMING_CHUNK:Checking out repository code...
- uses: actions/checkout@v4

# STREAMING_CHUNK:Setting up Java and Flutter environment...
- name: Configurar Java 17
  uses: actions/setup-java@v4
  with:
    distribution: 'zulu'
    java-version: '17'

- name: Configurar Flutter
  uses: subosito/flutter-action@v2
  with:
    channel: 'stable'

# STREAMING_CHUNK:Generating Android structure and setting app name...
- name: Generar estructura Android
  run: flutter create --platforms=android .

- name: Cambiar nombre de la App en Android
  run: |
    sed -i 's/android:label=".*"/android:label="Gastos Ruth"/g' android/app/src/main/AndroidManifest.xml

# STREAMING_CHUNK:Installing dependencies and building APK...
- name: Obtener dependencias
  run: flutter pub get

- name: Compilar APK
  run: flutter build apk --release --no-tree-shake-icons

# STREAMING_CHUNK:Uploading generated APK artifact...
- name: Subir archivo APK
  uses: actions/upload-artifact@v4
  with:
    name: app-gastos-ruth-release
    path: build/app/outputs/flutter-apk/app-release.apk
